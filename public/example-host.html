<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Embed Chatbot Example Host</title>
  <style>body{font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 40px;}</style>
</head>
<body>
  <h1>Example Host Page</h1>
  <p>This page demonstrates embedding the chatbot using a single script tag.</p>
  <p>
    Add this to any site:
  </p>
  <pre><code>&lt;script src="http://localhost:8787/embed.js" data-api-base="http://localhost:8787" data-title="Website Assistant" data-primary-color="#0061ff" data-company="Acme Inc"&gt;&lt;/script&gt;</code></pre>

  <script src="http://localhost:8787/embed.js"
    data-api-base="http://localhost:8787"
    data-title="Website Assistant"
    data-primary-color="#0061ff"
    data-company="Acme Inc">
  </script>
</body>
</html>
